name: Build MarKoss APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'

      - name: Check Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import sys; print(sys.version)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install buildozer==1.6.0

      - name: Install Cython
        run: |
          python -m pip install cython==0.29.34

      - name: Verify Build Environment
        run: |
          echo "===== PYTHON ====="
          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import sys; print(sys.version)"

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== CYTHON ====="
          cython --version

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -f build.log

      - name: Build MarKoss APK
        env:
          P4A_IS_BUILDING_FOR_DISTRIBUTION: "0"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          ls -lah bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarKoss-APK
          path: bin/*.apk

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarKoss-build-log
          path: build.log
          if-no-files-found: warn
