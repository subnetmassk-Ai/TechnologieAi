name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Setup Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # إنشاء ملفات التراخيص المقبولة تلقائياً
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        printf "2433373574b44d1528f65d2e2e40d610764d313a\n84831b9402116e26787d03926c45d574138f8700\nd975f751698a77ab62ed03c2214382a0fe3b6e22\n89370422745e0a392d75b360d9b378b9435050c2\n6010077a760f71f43a4d1635d321522f211516e0\n37b00217cd2270b11fd0033580e2b023f392d45c" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-apk
        path: bin/*.apk
