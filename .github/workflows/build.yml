name: Build MarKoss APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1 - Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2 - Python 3.10.15
      # ==========================================

      - name: Set up Python 3.10.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.15"


      # ==========================================
      # 3 - Java 17
      # ==========================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4 - Android / Linux dependencies
      # ==========================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            patch \
            gettext \
            libltdl-dev \
            ccache


      # ==========================================
      # 5 - Verify Python
      # ==========================================

      - name: Verify Python
        run: |

          echo "================================"
          echo "PYTHON VERSION"
          echo "================================"

          python --version

          echo "================================"
          echo "PYTHON LOCATION"
          echo "================================"

          which python

          echo "================================"
          echo "PIP VERSION"
          echo "================================"

          python -m pip --version


      # ==========================================
      # 6 - Install Build tools
      # ==========================================

      - name: Install Build tools
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<81" \
            wheel \
            "cython<3.4" \
            buildozer==1.6.0


      # ==========================================
      # 7 - Verify Buildozer
      # ==========================================

      - name: Verify Buildozer
        run: |

          echo "================================"
          echo "BUILDOZER"
          echo "================================"

          python -m buildozer --version

          echo "================================"
          echo "JAVA"
          echo "================================"

          java -version


      # ==========================================
      # 8 - Clean ALL old Android build files
      # ==========================================

      - name: Clean old Buildozer files
        run: |

          rm -rf .buildozer
          rm -rf ~/.buildozer

          rm -rf bin

          mkdir -p bin


      # ==========================================
      # 9 - Check buildozer.spec
      # ==========================================

      - name: Show buildozer.spec
        run: |

          echo "================================"
          echo "BUILD0ZER.SPEC"
          echo "================================"

          cat buildozer.spec


      # ==========================================
      # 10 - Build APK
      # ==========================================

      - name: Build Android APK
        env:
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "23"

        run: |

          python -m buildozer -v android debug


      # ==========================================
      # 11 - Find APK
      # ==========================================

      - name: Find APK
        if: always()
        run: |

          echo "================================"
          echo "APK FILES"
          echo "================================"

          find . -type f -name "*.apk" -print || true


      # ==========================================
      # 12 - Upload APK
      # ==========================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: MarKoss-APK

          path: bin/*.apk

          if-no-files-found: error
