name: Build MarKoss APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.15"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            patch \
            gettext \
            libltdl-dev

      - name: Upgrade pip
        run: |
          python --version
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install buildozer==1.6.0

      - name: Install python-for-android
        run: |
          python -m pip install python-for-android==2024.01.21

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Verify environment
        run: |
          echo "Python:"
          python --version

          echo "Python executable:"
          which python

          echo "Java:"
          java -version

      - name: Build Android APK
        env:
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "23"
        run: |
          python -m buildozer -v android debug

      - name: Show APK
        run: |
          echo "Searching for APK..."
          find bin -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarKoss-APK
          path: bin/*.apk
          if-no-files-found: error
