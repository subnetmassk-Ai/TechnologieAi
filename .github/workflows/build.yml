name: Build MarKoss APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install legacy-cgi
          python -m pip install cython==0.29.34
          python -m pip install buildozer

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          P4A_IS_BUILDING_FOR_DISTRIBUTION: "0"
        run: |
          yes | buildozer -v android debug

      - name: Show APK
        run: |
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarKoss-APK
          path: bin/*.apk
