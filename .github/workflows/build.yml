name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libbz2-dev \
            libltdl-dev \
            libtool \
            pkg-config \
            patch

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3"
          python -m pip install "buildozer==1.6.0"

      # قبول تراخيص Android قبل Buildozer
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # تثبيت الأدوات المطلوبة
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

      # قبول التراخيص مرة ثانية بعد التثبيت
      - name: Accept licenses again
        run: |
          yes | sdkmanager --licenses || true

      - name: Verify Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools/" || true

          echo "AIDL:"
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print || true

      - name: Clean
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show APK
        if: success()
        run: |
          echo "APK:"
          find bin -type f -name "*.apk" -ls

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
