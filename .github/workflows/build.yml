name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libssl-dev \
            openssl \
            zlib1g-dev \
            zlib1g \
            libffi-dev \
            patch \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zip \
            unzip \
            wget

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.36

      - name: Prepare Buildozer SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"
          mkdir -p "$SDK/tools/bin"

          SYSTEM_SDK="$ANDROID_SDK_ROOT"

          echo "System SDK:"
          echo "$SYSTEM_SDK"

          echo "Copying Android SDK..."

          cp -a "$SYSTEM_SDK/." "$SDK/"

          mkdir -p "$SDK/tools/bin"

          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "Buildozer sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

          echo "sdkmanager test:"
          "$SDK/tools/bin/sdkmanager" --version

      - name: Clean project build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Recreate Buildozer SDK link
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK/tools/bin/sdkmanager"
          fi

          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" ]; then
            ln -sf \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
              "$SDK/tools/bin/avdmanager"
          fi

          echo "Final sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

      - name: Build APK
        run: |
          python -m buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechnologieAi-APK
          path: bin/*.apk
          if-no-files-found: error
