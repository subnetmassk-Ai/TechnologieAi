name: Build MarKoss APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.15"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl zlib1g-dev libffi-dev patch autoconf automake libtool pkg-config cmake zip unzip wget ccache

      - name: Check Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0

      - name: Clean old files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          python -m buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarKoss-APK
          path: bin/*.apk
          if-no-files-found: error
